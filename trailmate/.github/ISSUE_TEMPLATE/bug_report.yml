name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact error text or a screenshot if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as jordan@example.com
        2. Open a paid hike
        3. Tap Book
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile app
        - Database / RLS
        - Edge Function
        - Payments / Stripe
        - Notifications
        - Unclear
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: local / staging / production, plus iOS or Android and build type
