project_id = "trailmate"

[api]
enabled = true
port = 54321
# `app` is deliberately absent: the security helpers in that schema must not be reachable
# from PostgREST.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "trailmate://"
# Deep links the OAuth/magic-link flows are allowed to return to (FR-7.4).
additional_redirect_urls = [
  "trailmate://auth-callback",
  "exp://127.0.0.1:8081",
  "http://127.0.0.1:8081",
]
jwt_expiry = 3600          # NFR-3: JWT expiry ≤ 1 h with refresh
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# FR-1.1 — Apple sign-in is mandatory on iOS once any other social login exists.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.rate_limit]
# NFR-3 — rate limiting on auth.
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[analytics]
enabled = false

# Stripe posts to this one unauthenticated: it authenticates itself with a signature
# header instead of a Supabase JWT.
[functions.stripe-webhook]
verify_jwt = false

# Cron-invoked functions authenticate with x-cron-secret.
[functions.release-payouts]
verify_jwt = false

[functions.send-notifications]
verify_jwt = false
